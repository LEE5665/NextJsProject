<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - JSP 게시판</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative; /* Relative positioning for the body */
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"],
        input[type="password"] {
            width: calc(100% - 20px); /* Adjust width to match button */
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0056b3; /* Unified button color */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004494;
        }
        .register-link {
            text-align: center;
            margin-top: 10px;
        }
        .register-link a {
            color: #0056b3;
            text-decoration: none;
        }
        .back-button {
            position: absolute; /* Absolute positioning for the back button */
            top: 20px; /* Distance from the top */
            right: 20px; /* Distance from the right */
            background-color: #ccc; /* Back button color */
            color: black;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: #aaa;
        }
    </style>
</head>
<body>

    <button class="back-button" onclick="window.history.back();">돌아가기</button>
    
    <div class="login-container">
        <h2>로그인</h2>
        <form action="login-process.html" method="POST">
            <input type="text" name="username" placeholder="사용자 이름" required>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>
        <div class="register-link">
            <p>아직 회원이 아니신가요? <a href="register.html">회원가입</a></p>
        </div>
    </div>

</body>
</html>
