<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개발 게시판</title>
    <style>
        :root {
            --primary-color: #2d3142;
            --secondary-color: #4f5d75;
            --accent-color: #ef8354;
            --background-color: #f0f4f8;
            --text-color: #000;
            --text-light: #ffffff;
            --border-radius: 10px;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica', sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary-color);
            color: var(--text-light);
            border-radius: var(--border-radius);
            margin-top: 40px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1rem;
            padding: 10px 20px;
            background-color: var(--secondary-color);
            border-radius: var(--border-radius);
            transition: background-color var(--transition-speed);
        }

        nav a:hover {
            background-color: var(--accent-color);
        }

        .login {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: var(--text-light);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .login:hover {
            background-color: #d7673c;
        }

        main {
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            margin-top: 20px;
        }

        .post-container {
            background-color: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            transition: box-shadow var(--transition-speed);
        }

        .post-container:hover {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .post-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .post-excerpt {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .post-author {
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .create-post {
            display: inline-block;
            margin-top: 20px;
            background-color: var(--accent-color);
            color: var(--text-light);
            padding: 12px 25px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-size: 1rem;
            transition: background-color var(--transition-speed);
            align-self: flex-end;
        }

        .create-post:hover {
            background-color: #d7673c;
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <header>
        <div class="logo">개발 게시판</div>
        <nav>
            <a href="#">홈</a>
            <a href="#">모든 글</a>
            <a href="#">검색</a>
        </nav>
        <button class="login">로그인</button>
    </header>

    <!-- 메인 콘텐츠 -->
    <main>
        <!-- 게시물 1 -->
        <div class="post-container">
            <h2 class="post-title">JSP Basics</h2>
            <p class="post-excerpt">이 게시물은 JSP에 관한 최신 정보를 담고 있습니다...</p>
            <p class="post-author"><strong>작성자:</strong> 홍길동</p>
        </div>

        <!-- 게시물 2 -->
        <div class="post-container">
            <h2 class="post-title">Advanced JSP Techniques</h2>
            <p class="post-excerpt">자바 최신 기술 트렌드와 관련된 내용을 확인해보세요...</p>
            <p class="post-author"><strong>작성자:</strong> 이순신</p>
        </div>

        <!-- 게시물 3 -->
        <div class="post-container">
            <h2 class="post-title">JSP with Databases</h2>
            <p class="post-excerpt">JSP와 데이터베이스를 연동하는 방법을 이해해보세요...</p>
            <p class="post-author"><strong>작성자:</strong> 김유신</p>
        </div>

        <!-- 게시물 작성 버튼 -->
        <a href="create-post.html" class="create-post">게시물 작성</a>
    </main>

</body>
</html>
